name: windows-x86_64

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - 'assets/**'
      - '*.md'
      - '**/*.md'
      - 'LICENSE*'
      - 'examples/**'
      - 'nerves/**'
      - 'Makefile'
      - 'cc_toolchain/**'
      - 'checksum.exs'
      - 'do_release.sh'
      - '.github/FUNDING.yml'
      - '.github/scripts/script-to-build-freebsd.sh'
      - '.github/workflows/nerves-*.yml'
      - '.github/workflows/linux-*.yml'
      - '.github/workflows/macos-*.yml'
      - '.github/workflows/freebsd-*.yml'
      - '.github/workflows/test-*.yml'
      - '.github/workflows/windows-precompile.yml'
      - '.github/workflows/opencv-js-*.yml'
      - '.github/*manylinux*.sh'
  push:
    branches:
      - main
      - test-*
    paths-ignore:
      - 'assets/**'
      - '*.md'
      - '**/*.md'
      - 'LICENSE*'
      - 'examples/**'
      - 'nerves/**'
      - 'Makefile'
      - 'cc_toolchain/**'
      - 'checksum.exs'
      - '.github/FUNDING.yml'
      - '.github/scripts/script-to-build-freebsd.sh'
      - '.github/workflows/nerves-*.yml'
      - '.github/workflows/linux-*.yml'
      - '.github/workflows/macos-*.yml'
      - '.github/workflows/freebsd-*.yml'
      - '.github/workflows/test-*.yml'
      - '.github/workflows/windows-precompile-cuda.yml'
      - '.github/workflows/windows-precompile.yml'
      - '.github/workflows/opencv-js-*.yml'
      - '.github/*manylinux*.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mix_test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: windows-2022
    env:
      MIX_ENV: test
      OPENCV_VER: "5.1.0"
      OTP_VERSION: "29"
      ELIXIR_VERSION: "1.20.4"
      EVISION_PREFER_PRECOMPILED: "false"
      MAKE: "nmake"
      CCACHE_VER: "4.14.3"
      CCACHE_SHA256: "c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd"
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "1"
      CMAKE_EVISION_OPTIONS: "-D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ccache
        shell: bash
        run: |
          curl -fsSL -o ccache.zip "https://github.com/ccache/ccache/releases/download/v${CCACHE_VER}/ccache-${CCACHE_VER}-windows-x86_64.zip"
          echo "${CCACHE_SHA256}  ccache.zip" | sha256sum -c -
          unzip -q ccache.zip -d "${RUNNER_TEMP}"
          rm ccache.zip
          echo "${RUNNER_TEMP}/ccache-${CCACHE_VER}-windows-x86_64" >> "${GITHUB_PATH}"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache mix packages
        id: cache-mix-deps
        uses: actions/cache@v6
        with:
          key: mix-deps-x86_64-windows-msvc-${{ hashFiles('mix.lock') }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}
          path: |
            ./deps
            ./_build/${{ env.MIX_ENV }}/lib/*
            !./_build/${{ env.MIX_ENV }}/lib/evision

      - name: Get mix deps
        if: steps.cache-mix-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mix deps.get

      - name: Cache OpenCV source code
        id: cache-opencv
        uses: actions/cache@v6
        with:
          key: opencv-${{ env.OPENCV_VER }}-${{ hashFiles('patches/**') }}
          path: |
            ./3rd_party

      - name: Download OpenCV source code
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash scripts/download_opencv.sh ${OPENCV_VER} 3rd_party/cache 3rd_party/opencv/
          bash scripts/download_opencv_contrib.sh ${OPENCV_VER} 3rd_party/cache 3rd_party/opencv/

      - name: Cache compiled OpenCV
        id: cache-mix-compile
        uses: actions/cache@v6
        with:
          key: compiled-opencv-${{ env.OPENCV_VER }}-x86_64-windows-msvc-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-${{ hashFiles('Makefile.win') }}-${{ hashFiles('cmake/OpenCVDetectCUDAUtils.cmake') }}-${{ hashFiles('patches/**') }}
          path: |
            ./_build/${{ env.MIX_ENV }}/lib/evision
            ./c_src/gen_python_config.json
            ./c_src/gen_python_config-contrib.json
            ./c_src/configuration.private.hpp

      - name: Apply OpenCV patches
        # apply_patch.py is idempotent; run it unconditionally so the OpenCV
        # source tree is always patched before the build. The Makefile-driven
        # patch step is gated behind build stamps that the compiled-opencv
        # cache restores, so it cannot be relied on.
        shell: bash
        run: python3 patches/apply_patch.py "$(pwd)/3rd_party/opencv/opencv-${OPENCV_VER}" "${OPENCV_VER}"

      - name: Compile OpenCV
        if: steps.cache-mix-compile.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -f Makefile
          mix compile_opencv

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-x86_64-windows-msvc-${{ github.sha }}
          restore-keys: ccache-x86_64-windows-msvc-

      - name: Mix Compile
        shell: bash
        run: |
          export CCACHE_DIR="$(cygpath -w "$PWD/.ccache")"
          ccache -z
          rm -f Makefile
          rm -f "_build/${MIX_ENV}/lib/evision/priv/evision.dll"
          rm -f "_build/${MIX_ENV}/lib/evision/priv/windows_fix.dll"

          rm -rf lib/generated && rm -rf src/generated
          mkdir -p lib/generated && mkdir -p src/generated

          mix compile
          ccache -s

      - name: Save ccache
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-x86_64-windows-msvc-${{ github.sha }}

      - name: Compile once again but without optional deps
        shell: bash
        run: |
          mix compile --force --warnings-as-errors --no-optional-deps

      - name: Test native conversions and CPU dispatch
        shell: bash
        run: mix test --no-compile test/evision_native_conversion_safety_test.exs test/evision_cpu_dispatch_test.exs test/evision_backend_benchmark_test.exs test/evision_moments_test.exs test/evision_mat_channel_test.exs test/evision_backend_multiply_semantics_test.exs test/evision_backend_dot_gemm_test.exs test/evision_backend_cast_elision_test.exs test/evision_backend_matching_shape_test.exs test/evision_backend_broadcast_suffix_test.exs test/evision_mat_f16_type_test.exs test/evision_backend_scalar_comparison_test.exs test/evision_backend_min_max_type_test.exs test/evision_backend_native_half_reduce_test.exs test/evision_backend_half_product_test.exs

      - name: Cache testdata
        id: cache-mix-testdata
        uses: actions/cache@v6
        with:
          key: testdata-${{ hashFiles('test/downloading_list.txt') }}
          path: |
            ./test/testdata

      # - name: Mix Test
      #   shell: bash
      #   run: |
      #     mix test --include require_downloading --include require_ffmpeg --exclude may_crash

      - name: create tarball
        shell: bash
        run: |
          export ROOT_DIR="$(pwd)"
          cd _build/${MIX_ENV}/lib/evision/priv
          tar -czf "${ROOT_DIR}/evision-windows.tar.gz" .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evision-windows.tar.gz
          path: evision-windows.tar.gz
