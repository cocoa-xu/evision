name: linux-precompile-gnu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to tag, without the leading v (e.g. 1.0.0-rc.1)"
        required: true
        type: string
      x86_64:
        description: "Build x86_64-linux-gnu"
        type: boolean
        default: false
      i686:
        description: "Build i686-linux-gnu"
        type: boolean
        default: false
      aarch64:
        description: "Build aarch64-linux-gnu"
        type: boolean
        default: false
      armv7l:
        description: "Build armv7l-linux-gnueabihf"
        type: boolean
        default: false
      armv6:
        description: "Build armv6-linux-gnueabihf"
        type: boolean
        default: false
      s390x:
        description: "Build s390x-linux-gnu"
        type: boolean
        default: true
      riscv64:
        description: "Build riscv64-linux-gnu"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      smoke: ${{ steps.gen.outputs.smoke }}
      version: ${{ steps.gen.outputs.version }}
    steps:
      - name: Resolve build matrix and release version
        id: gen
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IN_VERSION: ${{ inputs.version }}
          IN_X86_64: ${{ inputs.x86_64 }}
          IN_I686: ${{ inputs.i686 }}
          IN_AARCH64: ${{ inputs.aarch64 }}
          IN_ARMV7L: ${{ inputs.armv7l }}
          IN_ARMV6: ${{ inputs.armv6 }}
          IN_S390X: ${{ inputs.s390x }}
          IN_RISCV64: ${{ inputs.riscv64 }}
        run: |
          set -euo pipefail

          # Single source of truth for the build matrix; field names mirror the
          # build steps (matrix.pair.*). ppc64le-linux-gnu stays disabled.
          all="$(cat <<'JSON'
          [
            {"pair":{"arch":"x86_64-linux-gnu","cmake_toolchain_file":"","c_compiler":"gcc","cpp_compiler":"g++","OTP_VERSION":"25","NIF_VERSION":"2.16"}},
            {"pair":{"arch":"i686-linux-gnu","cmake_toolchain_file":"cc_toolchain/i686-linux-gnu.cmake","c_compiler":"gcc-i686-linux-gnu","cpp_compiler":"g++-i686-linux-gnu","OTP_VERSION":"25","NIF_VERSION":"2.16"}},
            {"pair":{"arch":"aarch64-linux-gnu","cmake_toolchain_file":"cc_toolchain/aarch64-linux-gnu.cmake","c_compiler":"gcc-aarch64-linux-gnu","cpp_compiler":"g++-aarch64-linux-gnu","OTP_VERSION":"25","NIF_VERSION":"2.16"}},
            {"pair":{"arch":"armv7l-linux-gnueabihf","cmake_toolchain_file":"cc_toolchain/armv7l-linux-gnueabihf.cmake","c_compiler":"gcc-arm-linux-gnueabihf","cpp_compiler":"g++-arm-linux-gnueabihf","OTP_VERSION":"25","NIF_VERSION":"2.16"}},
            {"pair":{"arch":"armv6-linux-gnueabihf","cmake_toolchain_file":"cc_toolchain/armv6-nerves-linux-gnueabihf.cmake","c_compiler":"armv6-nerves-linux-gnueabihf-gcc","cpp_compiler":"armv6-nerves-linux-gnueabihf-g++","OTP_VERSION":"25","NIF_VERSION":"2.16"}},
            {"pair":{"arch":"s390x-linux-gnu","cmake_toolchain_file":"cc_toolchain/s390x-linux-gnu.cmake","c_compiler":"gcc-s390x-linux-gnu","cpp_compiler":"g++-s390x-linux-gnu","OTP_VERSION":"25","NIF_VERSION":"2.16"}},
            {"pair":{"arch":"riscv64-linux-gnu","cmake_toolchain_file":"cc_toolchain/riscv64-linux-gnu.cmake","c_compiler":"gcc-riscv64-linux-gnu","cpp_compiler":"g++-riscv64-linux-gnu","OTP_VERSION":"25","NIF_VERSION":"2.16"}}
          ]
          JSON
          )"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${IN_VERSION##*v}"
            if [ -z "$version" ]; then
              echo "::error::A release version is required." >&2
              exit 1
            fi

            sel=()
            [ "$IN_X86_64" = "true" ]  && sel+=("x86_64-linux-gnu")
            [ "$IN_I686" = "true" ]    && sel+=("i686-linux-gnu")
            [ "$IN_AARCH64" = "true" ] && sel+=("aarch64-linux-gnu")
            [ "$IN_ARMV7L" = "true" ]  && sel+=("armv7l-linux-gnueabihf")
            [ "$IN_ARMV6" = "true" ]   && sel+=("armv6-linux-gnueabihf")
            [ "$IN_S390X" = "true" ]   && sel+=("s390x-linux-gnu")
            [ "$IN_RISCV64" = "true" ] && sel+=("riscv64-linux-gnu")

            if [ "${#sel[@]}" -eq 0 ]; then
              echo "::error::Select at least one architecture to build." >&2
              exit 1
            fi

            keep="$(printf '%s\n' "${sel[@]}" | jq -R . | jq -c -s .)"
            matrix="$(echo "$all" | jq -c --argjson keep "$keep" '[ .[] | select(.pair.arch as $a | $keep | index($a)) ]')"
          else
            version="${REF##*/v}"
            matrix="$(echo "$all" | jq -c .)"
          fi

          # Every built target with FFmpeg plugins is tested against each FFmpeg major,
          # and without FFmpeg.
          distros="$(cat <<'JSON'
          [
            {"name":"Ubuntu 22.04, FFmpeg 4.4","image":"hexpm/elixir:1.17.3-erlang-26.2.5.21-ubuntu-jammy-20261110","ffmpeg":"apt"},
            {"name":"Debian 12, FFmpeg 5.1","image":"hexpm/elixir:1.17.3-erlang-26.2.5.21-debian-bookworm-20261104","ffmpeg":"apt"},
            {"name":"Ubuntu 24.04, FFmpeg 6.1","image":"hexpm/elixir:1.17.3-erlang-26.2.5.21-ubuntu-noble-20261110.1","ffmpeg":"apt"},
            {"name":"Debian 13, FFmpeg 7.1","image":"hexpm/elixir:1.17.3-erlang-26.2.5.21-debian-trixie-20261104","ffmpeg":"apt"},
            {"name":"Ubuntu 26.04, FFmpeg 8.0","image":"hexpm/elixir:1.17.3-erlang-26.2.5.21-ubuntu-resolute-20261105.1","ffmpeg":"apt"},
            {"name":"Ubuntu 26.04, FFmpeg 9.1","image":"hexpm/elixir:1.17.3-erlang-26.2.5.21-ubuntu-resolute-20261105.1","ffmpeg":"9.1"},
            {"name":"Ubuntu 24.04, no FFmpeg","image":"hexpm/elixir:1.17.3-erlang-26.2.5.21-ubuntu-noble-20261110.1","ffmpeg":"none"}
          ]
          JSON
          )"
          smoke="$(echo "$matrix" | jq -c --argjson distros "$distros" '[.[] | .pair.arch | select(. == "x86_64-linux-gnu" or . == "aarch64-linux-gnu") as $arch | $distros[] | . + {arch: $arch, runs_on: (if $arch == "x86_64-linux-gnu" then "ubuntu-latest" else "ubuntu-24.04-arm" end)}]')"

          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          echo "smoke={\"include\":$smoke}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"
          echo "Resolved matrix:  $matrix"
          echo "FFmpeg smoke tests: $smoke"

  mix_compile:
    needs: setup
    runs-on: ubuntu-latest
    env:
      ImageOS: ubuntu20
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: en_US.UTF-8
      DEBIAN_FRONTEND: noninteractive
      OPENCV_VER: "5.1.0"
      MIX_ENV: prod
      ELIXIR_VERSION: "1.17.3"
      EVISION_PREFER_PRECOMPILED: "false"
      EVISION_GENERATE_LANG: "erlang,elixir"
      CMAKE_OPENCV_OPTIONS: "-D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache"
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          alias sudo=`which sudo`
          $sudo apt-get update -q
          $sudo apt-get install -y build-essential automake autoconf pkg-config bc m4 unzip zip curl git gzip python3 ca-certificates libncurses5-dev libssl-dev libeigen3-dev cmake
          if [ "${{ matrix.pair.arch }}" = "armv6-linux-gnueabihf" ]; then
            curl -fSL https://github.com/nerves-project/toolchains/releases/download/v13.2.0/nerves_toolchain_armv6_nerves_linux_gnueabihf-linux_x86_64-13.2.0-363664F.tar.xz -o nerves_toolchain_armv6_nerves_linux_gnueabihf-linux_x86_64-13.2.0-363664F.tar.xz
            tar -xf nerves_toolchain_armv6_nerves_linux_gnueabihf-linux_x86_64-13.2.0-363664F.tar.xz
            $sudo mv nerves_toolchain_armv6_nerves_linux_gnueabihf-linux_x86_64-13.2.0 /usr/local/bin/nerves_toolchain_armv6_nerves_linux_gnueabihf-linux_x86_64-13.2.0
          else
            $sudo apt-get install -y ${{ matrix.pair.c_compiler }} ${{ matrix.pair.cpp_compiler }}
          fi

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.pair.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache mix packages
        id: cache-mix-deps
        uses: actions/cache@v6
        with:
          key: deps-${{ hashFiles('mix.lock') }}-${{ matrix.pair.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}
          path: |
            ./deps

      - name: Get mix deps
        if: steps.cache-mix-deps.outputs.cache-hit != 'true'
        run: |
          mix deps.get

      - name: Cache OpenCV source code
        id: cache-opencv
        uses: actions/cache@v6
        with:
          key: opencv-with-contrib-${{ env.OPENCV_VER }}-${{ hashFiles('patches/**') }}
          path: |
            ./3rd_party

      - name: Download OpenCV source code
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          bash scripts/download_opencv.sh ${OPENCV_VER} 3rd_party/cache 3rd_party/opencv/
          bash scripts/download_opencv_contrib.sh ${OPENCV_VER} 3rd_party/cache 3rd_party/opencv/

      - uses: ./.github/actions/ccache
        with:
          mode: restore
          name: ${{ matrix.pair.arch }}

      - name: Compile OpenCV (without contrib modules)
        run: |
          export EVISION_ENABLE_CONTRIB=false

          if [ "${{ matrix.pair.cmake_toolchain_file }}" != "" ]; then
            export CMAKE_TOOLCHAIN_FILE="$(pwd)/${{ matrix.pair.cmake_toolchain_file }}"
          fi
          if [ "${{ matrix.pair.arch }}" = "armv6-linux-gnueabihf" ]; then
            export TARGET_GCC_FLAGS="-mabi=aapcs-linux -mfpu=vfp -marm -fstack-protector-strong -mfloat-abi=hard -mcpu=arm1176jzf-s -fPIE -pie -Wl,-z,now -Wl,-z,relro"
          fi
          echo "CMAKE_TOOLCHAIN_FILE: ${CMAKE_TOOLCHAIN_FILE}"

          rm -rf "./_build/${{ env.MIX_ENV }}/lib/evision"

          mix compile_opencv

      - name: Mix compile (without contrib modules)
        run: |
          export EVISION_ENABLE_CONTRIB=false

          if [ "${{ matrix.pair.cmake_toolchain_file }}" != "" ]; then
            export CMAKE_TOOLCHAIN_FILE="$(pwd)/${{ matrix.pair.cmake_toolchain_file }}"
          fi
          echo "CMAKE_TOOLCHAIN_FILE: ${CMAKE_TOOLCHAIN_FILE}"
          rm -f _build/${MIX_ENV}/lib/evision/priv/evision.so

          rm -rf lib/generated && rm -rf src/generated
          mkdir -p lib/generated && mkdir -p src/generated

          mix compile

      - name: Build the FFmpeg plugins (without contrib modules)
        if: matrix.pair.arch == 'x86_64-linux-gnu' || matrix.pair.arch == 'aarch64-linux-gnu'
        run: |
          if [ "${{ matrix.pair.cmake_toolchain_file }}" != "" ]; then
            toolchain="$(pwd)/${{ matrix.pair.cmake_toolchain_file }}"
          fi
          bash .github/scripts/build-ffmpeg-plugins.sh "${{ matrix.pair.arch }}" "_build/${MIX_ENV}/lib/evision/priv" ${toolchain}

      - name: Create precompiled library (without contrib modules)
        run: |
          export PKG_NAME=evision-nif_${{ matrix.pair.NIF_VERSION }}-${{ matrix.pair.arch }}-${{ needs.setup.outputs.version }}
          mkdir -p "${PKG_NAME}"
          export PRIV_DIR="$(pwd)/_build/${MIX_ENV}/lib/evision/priv"
          mv "${PRIV_DIR}/include" /tmp/include
          cp -a "${PRIV_DIR}" "${PKG_NAME}"
          cp -a lib/generated "${PKG_NAME}/elixir_generated"
          cp -a src/generated "${PKG_NAME}/erlang_generated"
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          rm -rf "${PKG_NAME}"
          ls -lah "${PKG_NAME}.tar.gz"
          mkdir -p artifacts
          mv "${PKG_NAME}.tar.gz" artifacts
          cd artifacts
          sha256sum "${PKG_NAME}.tar.gz" | tee "${PKG_NAME}.tar.gz.sha256"
          mv /tmp/include "${PRIV_DIR}/include"

      - name: Bundle the FFmpeg smoke test
        if: matrix.pair.arch == 'x86_64-linux-gnu' || matrix.pair.arch == 'aarch64-linux-gnu'
        run: bash .github/scripts/ffmpeg-smoke/bundle.sh "ffmpeg-smoke-${{ matrix.pair.arch }}.tar.gz"

      - uses: actions/upload-artifact@v7
        if: matrix.pair.arch == 'x86_64-linux-gnu' || matrix.pair.arch == 'aarch64-linux-gnu'
        with:
          name: ffmpeg-smoke-${{ matrix.pair.arch }}
          path: ffmpeg-smoke-${{ matrix.pair.arch }}.tar.gz
          retention-days: 7

      - name: Compile OpenCV (with contrib modules)
        run: |
          export EVISION_ENABLE_CONTRIB=true

          if [ "${{ matrix.pair.cmake_toolchain_file }}" != "" ]; then
            export CMAKE_TOOLCHAIN_FILE="$(pwd)/${{ matrix.pair.cmake_toolchain_file }}"
          fi
          if [ "${{ matrix.pair.arch }}" = "armv6-linux-gnueabihf" ]; then
            export TARGET_GCC_FLAGS="-mabi=aapcs-linux -mfpu=vfp -marm -fstack-protector-strong -mfloat-abi=hard -mcpu=arm1176jzf-s -fPIE -pie -Wl,-z,now -Wl,-z,relro"
          fi
          echo "CMAKE_TOOLCHAIN_FILE: ${CMAKE_TOOLCHAIN_FILE}"

          rm -rf "./_build/${{ env.MIX_ENV }}/lib/evision"

          mix compile_opencv

      - name: Mix compile (with contrib modules)
        run: |
          export EVISION_ENABLE_CONTRIB=true

          if [ "${{ matrix.pair.cmake_toolchain_file }}" != "" ]; then
            export CMAKE_TOOLCHAIN_FILE="$(pwd)/${{ matrix.pair.cmake_toolchain_file }}"
          fi
          echo "CMAKE_TOOLCHAIN_FILE: ${CMAKE_TOOLCHAIN_FILE}"
          rm -f _build/${MIX_ENV}/lib/evision/priv/evision.so

          rm -rf lib/generated && rm -rf src/generated
          mkdir -p lib/generated && mkdir -p src/generated

          mix compile

      - name: Build the FFmpeg plugins (with contrib modules)
        if: matrix.pair.arch == 'x86_64-linux-gnu' || matrix.pair.arch == 'aarch64-linux-gnu'
        run: |
          if [ "${{ matrix.pair.cmake_toolchain_file }}" != "" ]; then
            toolchain="$(pwd)/${{ matrix.pair.cmake_toolchain_file }}"
          fi
          bash .github/scripts/build-ffmpeg-plugins.sh "${{ matrix.pair.arch }}" "_build/${MIX_ENV}/lib/evision/priv" ${toolchain}

      - name: Create precompiled library (with contrib modules)
        run: |
          export PKG_NAME=evision-nif_${{ matrix.pair.NIF_VERSION }}-${{ matrix.pair.arch }}-contrib-${{ needs.setup.outputs.version }}
          mkdir -p "${PKG_NAME}"

          export PRIV_DIR="$(pwd)/_build/${MIX_ENV}/lib/evision/priv"
          mv "${PRIV_DIR}/include" /tmp/include
          cp -a "${PRIV_DIR}" "${PKG_NAME}"
          cp -a lib/generated "${PKG_NAME}/elixir_generated"
          cp -a src/generated "${PKG_NAME}/erlang_generated"
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          rm -rf "${PKG_NAME}"
          ls -lah "${PKG_NAME}.tar.gz"
          mkdir -p artifacts
          mv "${PKG_NAME}.tar.gz" artifacts
          cd artifacts
          sha256sum "${PKG_NAME}.tar.gz" | tee "${PKG_NAME}.tar.gz.sha256"
          mv /tmp/include "${PRIV_DIR}/include"

      - uses: ./.github/actions/upload-release
        with:
          tag: v${{ needs.setup.outputs.version }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256

      - uses: ./.github/actions/ccache
        with:
          mode: save
          name: ${{ matrix.pair.arch }}

  ffmpeg_smoke:
    name: ffmpeg_smoke (${{ matrix.arch }}, ${{ matrix.name }})
    needs: [setup, mix_compile]
    if: ${{ !cancelled() && needs.setup.outputs.smoke != '{"include":[]}' }}
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.smoke) }}
    env:
      LANG: C.UTF-8
      DEBIAN_FRONTEND: noninteractive
      OPENCV_LOG_LEVEL: INFO

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-smoke-${{ matrix.arch }}

      - name: Install FFmpeg from the distribution
        if: matrix.ffmpeg == 'apt'
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      - name: Install curl
        if: matrix.ffmpeg != 'apt' && matrix.ffmpeg != 'none'
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends curl ca-certificates

      - uses: cocoa-xu/ffmpeg-build@main
        if: matrix.ffmpeg != 'apt' && matrix.ffmpeg != 'none'
        with:
          ffmpeg_version: ${{ matrix.ffmpeg }}
          install-dir: /opt/ffmpeg

      - name: Make /opt/ffmpeg the system FFmpeg
        if: matrix.ffmpeg != 'apt' && matrix.ffmpeg != 'none'
        run: |
          echo /opt/ffmpeg/lib > /etc/ld.so.conf.d/ffmpeg.conf
          ldconfig
          ffmpeg -hide_banner -version | head -n 1

      - name: Run the FFmpeg video tests
        if: matrix.ffmpeg != 'none'
        run: |
          tar -xzf "ffmpeg-smoke-${{ matrix.arch }}.tar.gz"
          ERL_LIBS="$PWD/smoke/lib" elixir smoke/run_tests.exs

      - name: Check evision without FFmpeg
        if: matrix.ffmpeg == 'none'
        run: |
          tar -xzf "ffmpeg-smoke-${{ matrix.arch }}.tar.gz"
          ERL_LIBS="$PWD/smoke/lib" elixir smoke/no_ffmpeg.exs
