name: linux-x86_64

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - 'assets/**'
      - '*.md'
      - '**/*.md'
      - 'LICENSE*'
      - 'examples/**'
      - 'nerves/**'
      - 'Makefile.win'
      - 'cc_toolchain/**'
      - 'c_src/windows_fix/windows_fix.cpp'
      - 'checksum.exs'
      - 'do_release.sh'
      - '.github/FUNDING.yml'
      - '.github/scripts/script-to-build-freebsd.sh'
      - '.github/workflows/nerves-*'
      - '.github/workflows/macos-*'
      - '.github/workflows/windows-*'
      - '.github/workflows/freebsd-*'
      - '.github/workflows/test-*.yml'
      - '.github/workflows/linux-arm64.yml'
      - '.github/workflows/linux-armv7.yml'
      - '.github/workflows/linux-ppc64le.yml'
      - '.github/workflows/linux-s390x.yml'
      - '.github/workflows/linux-cuda-*.yml'
      - '.github/workflows/linux-precompile-*.yml'
      - '.github/workflows/opencv-js-*.yml'
      - '.github/*manylinux*.sh'
  push:
    branches:
      - main
      - feature-*
      - experimental-*
      - test-*
      - fix-*
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'LICENSE*'
      - 'examples/**'
      - 'nerves/**'
      - 'Makefile.win'
      - 'cc_toolchain/**'
      - 'c_src/windows_fix/windows_fix.cpp'
      - 'checksum.exs'
      - '.github/FUNDING.yml'
      - '.github/scripts/script-to-build-freebsd.sh'
      - '.github/workflows/nerves-*'
      - '.github/workflows/macos-*'
      - '.github/workflows/windows-*'
      - '.github/workflows/freebsd-*'
      - '.github/workflows/test-*.yml'
      - '.github/workflows/linux-arm64.yml'
      - '.github/workflows/linux-armv7.yml'
      - '.github/workflows/linux-ppc64le.yml'
      - '.github/workflows/linux-s390x.yml'
      - '.github/workflows/linux-cuda-*.yml'
      - '.github/workflows/linux-precompile-*.yml'
      - '.github/workflows/opencv-js-*.yml'
      - '.github/*manylinux*.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  musl:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    container: alpine:3.18.12
    env:
      MIX_ENV: test
      OPENCV_VER: "5.1.0"
      OTP_VERSION: "26.2.2"
      ELIXIR_VERSION: "1.17.3"
      EVISION_PREFER_PRECOMPILED: "false"
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "1"
      CMAKE_EVISION_OPTIONS: "-D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apk add cmake make python3 bash curl unzip gcc g++ ncurses-dev openssl-dev linux-headers perl git dpkg ca-certificates ccache
          curl -fSL https://github.com/cocoa-xu/otp-build/releases/download/v${{ env.OTP_VERSION }}/otp-x86_64-linux-musl.tar.gz -o /tmp/otp-v${{ env.OTP_VERSION }}-x86_64-linux-musl.tar.gz
          tar -xzf /tmp/otp-v${{ env.OTP_VERSION }}-x86_64-linux-musl.tar.gz -C /usr/local --strip-components=3

      - name: Install elixir
        run: |
          curl -fsSL -o /tmp/elixir.zip "https://github.com/elixir-lang/elixir/releases/download/v${ELIXIR_VERSION}/elixir-otp-${OTP_VERSION%%.*}.zip"
          mkdir -p "${HOME}/.elixir/elixir-${ELIXIR_VERSION}"
          unzip -q /tmp/elixir.zip -d "${HOME}/.elixir/elixir-${ELIXIR_VERSION}"
          rm /tmp/elixir.zip
          echo "${HOME}/.elixir/elixir-${ELIXIR_VERSION}/bin" >> "${GITHUB_PATH}"
          export PATH="${PATH}:${HOME}/.elixir/elixir-${ELIXIR_VERSION}/bin"
          mix local.hex --force
          mix local.rebar --force

      - name: Cache mix packages
        id: cache-mix-deps
        uses: actions/cache@v6
        with:
          key: mix-deps-x86_64-linux-musl-${{ hashFiles('mix.lock') }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}
          path: |
            ./deps
            ./_build/${{ env.MIX_ENV }}/lib/*
            !./_build/${{ env.MIX_ENV }}/lib/evision

      - name: Get mix deps
        if: steps.cache-mix-deps.outputs.cache-hit != 'true'
        run: |
          export PATH="${PATH}:${HOME}/.elixir/elixir-${ELIXIR_VERSION}/bin"
          mix deps.get

      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@v6
        with:
          key: opencv-with-contrib-${{ env.OPENCV_VER }}-${{ hashFiles('patches/**') }}
          path: |
            ./3rd_party

      - name: Download OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          bash scripts/download_opencv.sh ${OPENCV_VER} 3rd_party/cache 3rd_party/opencv/
          bash scripts/download_opencv_contrib.sh ${OPENCV_VER} 3rd_party/cache 3rd_party/opencv/

      - name: Cache compiled OpenCV
        id: cache-mix-compile_opencv
        uses: actions/cache@v6
        with:
          key: compile-opencv-v${{ env.OPENCV_VER }}-x86_64-linux-musl-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-${{ hashFiles('Makefile') }}-${{ hashFiles('cmake/OpenCVDetectCUDAUtils.cmake') }}-${{ hashFiles('patches/**') }}
          path: |
            ./_build/${{ env.MIX_ENV }}/lib/evision
            ./c_src/headers.txt
            ./c_src/configuration.private.hpp

      - name: Apply OpenCV patches
        # apply_patch.py is idempotent; run it unconditionally so the OpenCV
        # source tree is always patched before the build. The Makefile-driven
        # patch step is gated behind build stamps that the compiled-opencv
        # cache restores, so it cannot be relied on.
        shell: bash
        run: python3 patches/apply_patch.py "$(pwd)/3rd_party/opencv/opencv-${OPENCV_VER}" "${OPENCV_VER}"

      - name: Compile OpenCV
        if: steps.cache-mix-compile_opencv.outputs.cache-hit != 'true'
        run: |
          export PATH="${PATH}:${HOME}/.elixir/elixir-${ELIXIR_VERSION}/bin"
          mix compile_opencv

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-x86_64-linux-musl-${{ github.sha }}
          restore-keys: ccache-x86_64-linux-musl-

      - name: Mix Compile
        run: |
          export PATH="${PATH}:${HOME}/.elixir/elixir-${ELIXIR_VERSION}/bin"
          export CCACHE_DIR="$PWD/.ccache"
          ccache -z
          rm -f _build/${{ env.MIX_ENV }}/lib/evision/priv/evision.so
          ls -la ./c_src
          mix compile
          ls -la ./lib/generated
          ccache -s

      - name: Save ccache
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-x86_64-linux-musl-${{ github.sha }}

      - name: Cache testdata
        id: cache-mix-testdata
        uses: actions/cache@v6
        with:
          key: testdata-${{ hashFiles('test/downloading_list.txt') }}
          path: |
            ./test/testdata

      - name: Mix Test
        run: |
          mix test --include require_downloading

  gnu:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      ImageOS: ubuntu20
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: en_US.UTF-8
      DEBIAN_FRONTEND: noninteractive
      MIX_ENV: test
      OPENCV_VER: "5.1.0"
      OTP_VERSION: "25.2"
      ELIXIR_VERSION: "1.17.3"
      EVISION_PREFER_PRECOMPILED: "false"
      PKG_CONFIG_PATH: "/usr/lib/x86_64-linux-gnu/pkgconfig"
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "1"
      CMAKE_EVISION_OPTIONS: "-D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache"
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          alias sudo=`which sudo`
          # The Azure mirror sits next to the runners; archive.ubuntu.com has dropped connections mid-install.
          $sudo sed -i -e 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g' -e 's|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list
          $sudo apt-get update
          $sudo apt-get install -y --no-install-recommends build-essential automake autoconf pkg-config bc m4 unzip zip curl git libssl-dev gzip python3 ca-certificates \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev ffmpeg libeigen3-dev \
            cmake ccache

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      
      - name: Cache mix packages
        id: cache-mix-deps
        uses: actions/cache@v6
        with:
          key: mix-deps-x86_64-linux-gnu-${{ hashFiles('mix.lock') }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}
          path: |
            ./deps
            ./_build/${{ env.MIX_ENV }}/lib/*
            !./_build/${{ env.MIX_ENV }}/lib/evision

      - name: Get mix deps
        if: steps.cache-mix-deps.outputs.cache-hit != 'true'
        run: |
          mix deps.get

      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@v6
        with:
          key: opencv-with-contrib-${{ env.OPENCV_VER }}-${{ hashFiles('patches/**') }}
          path: |
            ./3rd_party

      - name: Download OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          bash scripts/download_opencv.sh ${OPENCV_VER} 3rd_party/cache 3rd_party/opencv/
          bash scripts/download_opencv_contrib.sh ${OPENCV_VER} 3rd_party/cache 3rd_party/opencv/

      - name: Cache compiled OpenCV
        id: cache-mix-compile_opencv
        uses: actions/cache@v6
        with:
          key: compiled-opencv-${{ env.OPENCV_VER }}-x86_64-linux-gnu-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-${{ hashFiles('Makefile') }}-${{ hashFiles('cmake/OpenCVDetectCUDAUtils.cmake') }}-${{ hashFiles('patches/**') }}
          path: |
            ./_build/${{ env.MIX_ENV }}/lib/evision
            ./c_src/headers.txt
            ./c_src/configuration.private.hpp

      - name: Apply OpenCV patches
        # apply_patch.py is idempotent; run it unconditionally so the OpenCV
        # source tree is always patched before the build. The Makefile-driven
        # patch step is gated behind build stamps that the compiled-opencv
        # cache restores, so it cannot be relied on.
        shell: bash
        run: python3 patches/apply_patch.py "$(pwd)/3rd_party/opencv/opencv-${OPENCV_VER}" "${OPENCV_VER}"

      - name: Compile OpenCV only
        if: steps.cache-mix-compile_opencv.outputs.cache-hit != 'true'
        run: |
          mix compile_opencv

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-x86_64-linux-gnu-${{ github.sha }}
          restore-keys: ccache-x86_64-linux-gnu-

      - name: Mix Compile
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          ccache -z
          rm -f _build/test/lib/evision/priv/evision.so

          rm -rf lib/generated && rm -rf src/generated
          mkdir -p lib/generated && mkdir -p src/generated

          mix compile
          ccache -s

      - name: Save ccache
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-x86_64-linux-gnu-${{ github.sha }}

      - name: Cache testdata
        id: cache-mix-testdata
        uses: actions/cache@v6
        with:
          key: testdata-${{ hashFiles('test/downloading_list.txt') }}
          path: |
            ./test/testdata

      - name: Mix Test
        run: |
          mix test --include require_downloading --include require_ffmpeg

      # After the tests, so the tests don't have to recompile everything with the optional deps again.
      - name: Compile once again but without optional deps
        run: mix compile --force --warnings-as-errors --no-optional-deps
