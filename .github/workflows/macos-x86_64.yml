name: macos-x86_64

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - 'assets/**'
      - '*.md'
      - '**/*.md'
      - 'LICENSE*'
      - 'examples/**'
      - 'nerves/**'
      - 'Makefile.win'
      - 'cc_toolchain/**'
      - 'c_src/windows_fix/windows_fix.cpp'
      - 'checksum.exs'
      - 'do_release.sh'
      - '.github/FUNDING.yml'
      - '.github/scripts/script-to-build-freebsd.sh'
      - '.github/workflows/nerves-*.yml'
      - '.github/workflows/linux-*.yml'
      - '.github/workflows/windows-*.yml'
      - '.github/workflows/freebsd-*'
      - '.github/workflows/test-*.yml'
      - '.github/workflows/macos-precompile.yml'
      - '.github/workflows/macos-apple-device-precompile.yml'
      - '.github/workflows/opencv-js-*.yml'
      - '.github/*manylinux*.sh'
  push:
    branches:
      - main
      - test-*
    paths-ignore:
      - 'assets/**'
      - '*.md'
      - '**/*.md'
      - 'LICENSE*'
      - 'examples/**'
      - 'nerves/**'
      - 'Makefile.win'
      - 'cc_toolchain/**'
      - 'c_src/windows_fix/windows_fix.cpp'
      - 'checksum.exs'
      - '.github/FUNDING.yml'
      - '.github/scripts/script-to-build-freebsd.sh'
      - '.github/workflows/nerves-*.yml'
      - '.github/workflows/linux-*.yml'
      - '.github/workflows/windows-*.yml'
      - '.github/workflows/freebsd-*.yml'
      - '.github/workflows/test-*.yml'
      - '.github/workflows/macos-precompile.yml'
      - '.github/workflows/opencv-js-*.yml'
      - '.github/*manylinux*.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mix_test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: macos-15-intel
    env:
      OPENCV_VER: "5.1.0"
      MIX_ENV: "test"
      EVISION_PREFER_PRECOMPILED: "false"
      FFMPEG_VER: "6"
      OTP_VERSION: "26.2.5.9"
      ELIXIR_VERSION: "1.17.3"
      CMAKE_VER: "3.18.6"
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "1"
      # Direct mode can miss a newly added header that shadows an included one.
      CCACHE_NODIRECT: "1"
      # /usr/bin/c++ is the same shim for every Xcode, so hash the compiler version.
      CCACHE_COMPILERCHECK: "%compiler% -v"
      CMAKE_EVISION_OPTIONS: "-D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache"
    steps:
      - uses: actions/checkout@v7

      - name: Install FFmpeg, Erlang and Elixir
        run: |
          brew install autoconf coreutils curl git openssl wxwidgets asdf ffmpeg@6 eigen ccache
          brew link ffmpeg@6
          
          export OTP_VERSION="${{ env.OTP_VERSION }}"
          export OTP_MAIN_VER="${OTP_VERSION%%.*}"
          curl -fsSO https://elixir-lang.org/install.sh
          sh install.sh "elixir@${{ env.ELIXIR_VERSION }}" "otp@${{ env.OTP_VERSION }}"
          
          export PATH="$HOME/.elixir-install/installs/otp/${{ env.OTP_VERSION }}/bin:$HOME/.elixir-install/installs/elixir/${{ env.ELIXIR_VERSION }}-otp-${OTP_MAIN_VER}/bin:$PATH"
          mix local.hex --force
          mix local.rebar --force

          asdf plugin add cmake
          asdf install cmake "${{ env.CMAKE_VER }}"
          asdf set --home cmake "${{ env.CMAKE_VER }}"

      - name: Cache mix packages
        id: cache-mix-deps
        uses: actions/cache@v6
        with:
          key: mix-deps-x86_64-apple-darwin-${{ hashFiles('mix.lock') }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}
          path: |
            ./deps
            ./_build/${{ env.MIX_ENV }}/lib/*
            !./_build/${{ env.MIX_ENV }}/lib/evision

      - name: Get mix deps
        if: steps.cache-mix-deps.outputs.cache-hit != 'true'
        run: |
          export OTP_VERSION="${{ env.OTP_VERSION }}"
          export OTP_MAIN_VER="${OTP_VERSION%%.*}"
          export PATH="$HOME/.elixir-install/installs/otp/${{ env.OTP_VERSION }}/bin:$HOME/.elixir-install/installs/elixir/${{ env.ELIXIR_VERSION }}-otp-${OTP_MAIN_VER}/bin:$PATH"
          mix deps.get

      - name: Cache OpenCV source code
        id: cache-opencv
        uses: actions/cache@v6
        with:
          key: opencv-with-contrib-${{ env.OPENCV_VER }}-${{ hashFiles('patches/**') }}
          path: |
            ./3rd_party

      - name: Download OpenCV source code
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          bash scripts/download_opencv.sh ${OPENCV_VER} 3rd_party/cache 3rd_party/opencv/
          bash scripts/download_opencv_contrib.sh ${OPENCV_VER} 3rd_party/cache 3rd_party/opencv/

      - name: Hash the OpenCV build options
        id: opencv-options
        shell: bash
        # The Makefile skips OpenCV when its outputs exist, so the key has to change with the options mix passes to it.
        run: |
          export OTP_VERSION="${{ env.OTP_VERSION }}"
          export OTP_MAIN_VER="${OTP_VERSION%%.*}"
          export PATH="$HOME/.elixir-install/installs/otp/${{ env.OTP_VERSION }}/bin:$HOME/.elixir-install/installs/elixir/${{ env.ELIXIR_VERSION }}-otp-${OTP_MAIN_VER}/bin:$PATH"
          options="$(mix run --no-compile --no-deps-check --no-start -e 'IO.write(Mix.Project.config()[:make_env]["CMAKE_OPTIONS"])')"
          echo "${options}"
          echo "hash=$(printf '%s' "${options}" | git hash-object --stdin)" >> "${GITHUB_OUTPUT}"

      - name: Cache compiled OpenCV
        id: cache-mix-compile_opencv
        uses: actions/cache@v6
        with:
          key: compiled-with-ffmpeg${{ env.FFMPEG_VER }}-opencv-${{ env.OPENCV_VER }}-x86_64-apple-darwin-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-${{ hashFiles('Makefile') }}-${{ hashFiles('cmake/OpenCVDetectCUDAUtils.cmake') }}-${{ hashFiles('patches/**') }}-${{ steps.opencv-options.outputs.hash }}
          path: |
            ./_build/${{ env.MIX_ENV }}/lib/evision
            ./c_src/headers.txt
            ./c_src/configuration.private.hpp

      - name: Apply OpenCV patches
        # apply_patch.py is idempotent; run it unconditionally so the OpenCV
        # source tree is always patched before the build. The Makefile-driven
        # patch step is gated behind build stamps that the compiled-opencv
        # cache restores, so it cannot be relied on.
        shell: bash
        run: python3 patches/apply_patch.py "$(pwd)/3rd_party/opencv/opencv-${OPENCV_VER}" "${OPENCV_VER}"

      - name: Compile OpenCV
        if: steps.cache-mix-compile_opencv.outputs.cache-hit != 'true'
        run: |
          cmake --version

          export OTP_VERSION="${{ env.OTP_VERSION }}"
          export OTP_MAIN_VER="${OTP_VERSION%%.*}"
          export PATH="$HOME/.elixir-install/installs/otp/${{ env.OTP_VERSION }}/bin:$HOME/.elixir-install/installs/elixir/${{ env.ELIXIR_VERSION }}-otp-${OTP_MAIN_VER}/bin:$PATH"
          mix compile_opencv

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-x86_64-apple-darwin-${{ github.sha }}
          restore-keys: ccache-x86_64-apple-darwin-

      - name: Mix Compile
        run: |
          export OTP_VERSION="${{ env.OTP_VERSION }}"
          export OTP_MAIN_VER="${OTP_VERSION%%.*}"
          export PATH="$HOME/.elixir-install/installs/otp/${{ env.OTP_VERSION }}/bin:$HOME/.elixir-install/installs/elixir/${{ env.ELIXIR_VERSION }}-otp-${OTP_MAIN_VER}/bin:$PATH"
          export CCACHE_DIR="$PWD/.ccache"
          ccache -z

          rm -f _build/test/lib/evision/priv/evision.so

          rm -rf lib/generated && rm -rf src/generated
          mkdir -p lib/generated && mkdir -p src/generated

          mix compile
          ccache -s

      - name: Save ccache
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-x86_64-apple-darwin-${{ github.sha }}

      - name: Cache testdata
        id: cache-mix-testdata
        uses: actions/cache@v6
        with:
          key: testdata-${{ hashFiles('test/downloading_list.txt') }}
          path: |
            ./test/testdata

      - name: Mix Test
        run: |
          export OTP_VERSION="${{ env.OTP_VERSION }}"
          export OTP_MAIN_VER="${OTP_VERSION%%.*}"
          export PATH="$HOME/.elixir-install/installs/otp/${{ env.OTP_VERSION }}/bin:$HOME/.elixir-install/installs/elixir/${{ env.ELIXIR_VERSION }}-otp-${OTP_MAIN_VER}/bin:$PATH"
          mix test --include require_downloading --include require_ffmpeg
          # wx and the native HighGui both take over the main thread, so each needs its own VM.
          mix test --include wx test/evision_wx_test.exs
          mix test --include highgui test/evision_highgui_test.exs

      # After the tests, so the tests don't have to recompile everything with the optional deps again.
      - name: Compile once again but without optional deps
        run: |
          export OTP_VERSION="${{ env.OTP_VERSION }}"
          export OTP_MAIN_VER="${OTP_VERSION%%.*}"
          export PATH="$HOME/.elixir-install/installs/otp/${{ env.OTP_VERSION }}/bin:$HOME/.elixir-install/installs/elixir/${{ env.ELIXIR_VERSION }}-otp-${OTP_MAIN_VER}/bin:$PATH"
          mix compile --force --no-optional-deps

      - name: Show crash reports
        if: failure()
        run: |
          # macOS writes the report several seconds after the process dies (~10 s for a
          # bare BEAM), and later still when many libraries are loaded.
          for _ in $(seq 1 24); do
            reports=$(find ~/Library/Logs/DiagnosticReports -maxdepth 1 -name '*.ips')
            [ -n "$reports" ] && break
            sleep 5
          done
          if [ -z "$reports" ]; then
            echo "No crash report after 120 s."
            exit 0
          fi
          mkdir -p crash-reports
          for f in $reports; do
            cp "$f" crash-reports/
            python3 - "$f" <<'PY'
          import json, sys
          body = json.loads(open(sys.argv[1]).read().split("\n", 1)[1])
          images = body["usedImages"]
          print(sys.argv[1], body["exception"])
          for thread in body["threads"]:
              print(("* " if thread.get("triggered") else "  ") + thread.get("name", thread.get("queue", "")))
              for frame in thread["frames"]:
                  print("      ", images[frame["imageIndex"]].get("name", "?"), frame.get("symbol", hex(frame["imageOffset"])))
          PY
          done

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: crash-reports
          path: crash-reports
          if-no-files-found: ignore
